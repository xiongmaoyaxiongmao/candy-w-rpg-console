<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技能与故事 · 隔离验收</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f2f2f2;color:#222;font-family:system-ui}#tools{position:fixed;top:12px;left:12px;width:230px;max-height:90vh;overflow:auto;display:grid;gap:8px}#tools button{min-height:36px}#receipt{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:520px){#tools{position:relative;left:auto;top:auto;width:auto;max-height:20vh;font-size:11px;margin:6px}#tools button{min-height:26px}}</style></head><body><nav id="tools"><strong>隔离验收 · 全部接口为模拟数据</strong><button id="finish">完成模拟演出</button><button id="use">尝试使用火球术</button><button id="next">按首条可用行动推进</button><button id="reload">刷新验收存档</button><pre id="receipt" aria-live="polite"></pre></nav><script type="module">
import {DirectorApplication} from '/src/application/index.js';
import {validateDirectorState,validateScenario} from '/src/domain/index.js';
import {PerChatRepository} from '/src/persistence/per-chat-repository.js';
import {DirectorUi} from '/src/ui/controller.js';
import {FakeOfficialAdapter} from '/tests/support/fake-official-adapter.mjs';
import {FOG_HARBOR_SCENARIO as scenario} from '/src/scenarios/index.js';
import {generatedPlayer} from '/tests/support/player-fixture.mjs';
const reviewMode=new URLSearchParams(location.search).has('review-draft');
const key=reviewMode?'candy-player-review-ui-20260909':'candy-skills-ui-qa-20260909';
const adapter=new FakeOfficialAdapter();adapter.selectSingle('qa-guide.png','skill-ui');adapter.currentPersona=()=>({name:'林雨',description:'已经学会火球术，正在练习掌握它。'});
const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){adapter.settings=saved.settings;Object.assign(adapter.currentChatMetadata(),saved.metadata);adapter.seedMessages(saved.messages);}
const save=()=>localStorage.setItem(key,JSON.stringify({settings:adapter.settings,metadata:adapter.currentChatMetadata(),messages:adapter.currentMessages()}));
const saveChat=adapter.saveCurrentChat.bind(adapter);adapter.saveCurrentChat=async(...args)=>{await saveChat(...args);save();};
const saveSettings=adapter.saveSettings.bind(adapter);adapter.saveSettings=(settings)=>{saveSettings(settings);save();};
const structured=adapter.generateStructured.bind(adapter);adapter.generateStructured=async(prompt,identity,options)=>{if(options.schema.properties.entries){const generated=generatedPlayer();if(reviewMode){generated.entries[1].name='强作镇定';generated.entries[1].rules[0].delta=0;}adapter.enqueueRaw(JSON.stringify(generated));}if(options.schema.properties.connection)adapter.enqueueRaw(JSON.stringify({title:'雨中的来信',summary:'在风暴中帮助送信人。',connection:'路边有人请求帮助。',scenes:[{title:'避雨亭',description:'送信人在亭下等候。',location:'码头亭',timeLabel:'此刻',objective:'接过来信',action:'接过来信',consequence:'你收好来信，回到原来的路线上。',minutes:2}]}));if(options.schema.properties.scenePlans){const brief=app.authoring.read(identity)?.source.brief;if(brief?.original&&brief.chapterOutline?.length){const draft=structuredClone(brief.original);delete draft.hash;const parts=draft.contentVersion.split('.').map(Number);parts[2]++;draft.contentVersion=parts.join('.');draft.acts=brief.chapterOutline.map((c,i)=>({...draft.acts.find(a=>a.id===c.id),number:i+1,title:c.title}));draft.scenes=draft.acts.flatMap(a=>draft.scenes.filter(s=>s.actId===a.id));draft.startSceneId=draft.scenes[0].id;for(let i=0;i<draft.scenes.length-1;i++){draft.scenes[i].moves.push({id:'qa_link_'+i,label:'继续前行',description:'沿调整后的章节前进',clockAdvance:0,attribute:null,checkId:null,conditions:{allFacts:[],anyFacts:[],notFacts:[]},mustHappen:['沿调整后的章节前进。'],revealSecretIds:[],publicPatch:{objective:null,knownPeopleIds:[],knownClueIds:[],itemIds:[],crisisIds:[]},hiddenPatch:{occurredFactIds:[],setVariables:{}},nextSceneId:draft.scenes[i+1].id,endingId:null});}adapter.enqueueScenario(draft,{includePlayer:false});}}return structured(prompt,identity,options);};
const repository=new PerChatRepository({adapter,validateState:validateDirectorState,validateScenario});
const app=new DirectorApplication({adapter,repository,deps:{random:()=>.34}}).start();const ui=new DirectorUi(app).mount();ui.show();
if(!repository.load()){await ui.perform('show-scenarios');ui.openScenarioSetup(app.listScenarios()[0].id);ui.render();}
const receipt=()=>{const s=repository.load();document.querySelector('#receipt').textContent=JSON.stringify({phase:s?.phase??'empty',revision:s?.revision,name:s?.player.name,scene:s?.hidden.currentSceneId,entries:s?.player.progression?.entries,check:s?.public.pendingCheck??s?.public.lastCheck,storedSettings:adapter.settings.scenarioSetups?.map(s=>({revision:s.revision,name:s.playerDraft.playerName,entries:s.playerEntries.length})),simulatedRequests:adapter.rawPrompts.length},null,2);};app.subscribe(receipt);receipt();
document.querySelector('#finish').addEventListener('click',async()=>{await adapter.completeGeneration('同伴看着你，耐心等你决定下一步。眼前的路仍然清晰，故事按照已经确定的行动继续。');save();receipt();});
document.querySelector('#use').addEventListener('click',async()=>{adapter.appendUser('我尝试使用火球术照明，前往泵房。');adapter.enqueueRaw(prompt=>{const r=JSON.parse(prompt.split('<action_request>\n')[1].split('\n</action_request>')[0]);return JSON.stringify({transactionId:r.transactionId,baseRevision:r.baseRevision,actionId:r.allowedMoves[0].id,attribute:scenario.scenes.flatMap(s=>s.moves).find(m=>m.id===r.allowedMoves[0].id).attribute,summary:'尝试使用火球术照明',nameChange:null,ruleIds:['p_success','p_failure'],skillId:'p_fire'});});await adapter.invokeInterceptor();receipt();});
document.querySelector('#next').addEventListener('click',async()=>{adapter.appendUser('我按照当前目标继续前行。');adapter.enqueueRaw(prompt=>{const r=JSON.parse(prompt.split('<action_request>\n')[1].split('\n</action_request>')[0]);const m=repository.loadScenario().scenes.flatMap(s=>s.moves).find(m=>m.id===r.allowedMoves[0].id);return JSON.stringify({transactionId:r.transactionId,baseRevision:r.baseRevision,actionId:m.id,attribute:m.attribute,summary:'按照当前目标前进',nameChange:null,ruleIds:[],skillId:null});});await adapter.invokeInterceptor();receipt();});
document.querySelector('#reload').addEventListener('click',()=>location.reload());
</script></body></html>
