<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>跑团欢迎页视觉检查</title>
    <link rel="stylesheet" href="../style.css">
    <style>body { min-height: 100vh; margin: 0; background: #17191e; } .fixture { height: 90vh; }</style>
</head>
<body>
    <main class="fixture" aria-label="SillyTavern 聊天区域"></main>
    <button id="cwrpc-toggle" type="button"><span aria-hidden="true">🎲</span><span class="cwrpc-toggle-label">跑团</span></button>
    <aside id="cwrpc-panel" class="open" aria-label="跑团控制台"><div class="cwrpc-panel-inner">
        <header class="cwrpc-header"><div><strong>跑团控制台</strong><small>先开一团，再让当前酒馆模型主持。</small></div><button class="cwrpc-icon" type="button">×</button></header>
        <section class="cwrpc-welcome"><span class="cwrpc-welcome-die">🎲</span><h2>准备开始跑团吗？</h2><p>只要填四项，当前聊天正在使用的 AI 就会担任主持人。你不需要配置 API，也不用先写主持提示。</p><button class="cwrpc-primary" type="button">开新团</button><p class="cwrpc-hint">不会自动发送消息；完成后由你点击“开始第一幕”。</p></section>
    </div></aside>
</body>
</html>
